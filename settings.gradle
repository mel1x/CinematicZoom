pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'CinematicZoom'

def targets = ['1.20.1', '1.21.1', '1.21.2', '1.21.5', '1.21.7', '1.21.11', '26.1', '26.2', '26.3']
def onlyTarget = gradle.startParameter.projectProperties['onlyTarget']
if (onlyTarget && !targets.contains(onlyTarget)) {
	throw new GradleException("Unknown Minecraft target: ${onlyTarget}")
}

(onlyTarget ? [onlyTarget] : targets).each { target ->
	include target
	project(":${target}").projectDir = file("versions/${target}")
}
